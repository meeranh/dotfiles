# Font
font_family      Iosevka NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 20

# Scrollback
scrollback_lines 5000

# Window
window_padding_width 4
confirm_os_window_close 0
close_on_child_death yes
enable_audio_bell no

# Performance
linux_display_server x11

# Colors
include colors.conf
